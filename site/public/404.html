<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0c0a" />
    <title>Track not found — TrackFinder</title>
    <link rel="icon" href="/apple-touch-icon.png" />
    <style>
      html { background: #0b0c0a; color: #eceee4; color-scheme: dark; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background-image: linear-gradient(to right, #1a1d16 1px, transparent 1px); background-size: 96px 100%; background-position: 48px 0; }
      main { background: #0b0c0a; padding: 8px; max-width: 34rem; }
      p.tag { font: 12px/1 ui-monospace, monospace; letter-spacing: .08em; color: #8a9080; text-transform: uppercase; margin: 0 0 20px; }
      h1 { font-size: clamp(2.4rem, 9vw, 4.5rem); line-height: .95; letter-spacing: -.03em; font-weight: 800; text-transform: uppercase; margin: 0; }
      h1 span { color: #c8ff2e; }
      p.copy { color: #8a9080; font-size: 1.1rem; line-height: 1.55; margin: 20px 0 32px; }
      a { display: inline-flex; align-items: center; gap: 8px; height: 52px; padding: 0 26px; border-radius: 999px;
        background: #c8ff2e; color: #0b0c0a; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid #c8ff2e; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="tag">404 · ID – ID</p>
      <h1>This one's <span>unreleased.</span></h1>
      <p class="copy">The page you were digging for doesn't exist. The tracks are back on the main page.</p>
      <a href="/">Back to TrackFinder</a>
    </main>
  </body>
</html>
