    <meta charset="UTF-8" />

    <meta name="google-site-verification" content="gUSZJASuXc6j2a-PV6WQTz2M93XW3RL4pj2kpqzHqCQ" />
    <meta name="msvalidate.01" content="396E109D893892C7D4BD0336E5C7D731" />
    <meta name="theme-color" content="#0b0c0a" />
    <meta name="color-scheme" content="dark" />
    <!-- Paint the page dark from the very first frame (no white flash) -->
    <style>html{background:#0b0c0a;color:#eceee4;color-scheme:dark}</style>
    <!-- Pick the right download button before first paint (the results end with it) -->
    <script>
      (function () {
        try {
          var n = navigator, ua = n.userAgent || '', d = n.userAgentData || {}
          var p = (d.platform || n.platform || '').toLowerCase()
          var touchMac = /mac/.test(p) && n.maxTouchPoints > 1
          var v = d.mobile || /android|iphone|ipad|ipod|mobile/i.test(ua) || touchMac ? 'mobile'
            : /win/.test(p) || /windows/i.test(ua) ? 'windows'
            : /mac/.test(p) || /mac os x/i.test(ua) ? 'mac' : 'other'
          document.documentElement.setAttribute('data-platform', v)
        } catch (e) {}
      })()
    </script>
    <title>Try Underset — See every set a DJ played</title>
    <meta
      name="description"
      content="Type a DJ and a period and see every set they played, with how many tracks are identified. A free live preview of Underset that works on your phone."
    />
