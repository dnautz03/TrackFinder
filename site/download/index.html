<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google-site-verification" content="gUSZJASuXc6j2a-PV6WQTz2M93XW3RL4pj2kpqzHqCQ" />
    <meta name="theme-color" content="#0b0c0a" />
    <meta name="color-scheme" content="dark" />
    <!-- Paint the page dark from the very first frame (no white flash) -->
    <style>html{background:#0b0c0a;color:#eceee4;color-scheme:dark}</style>
    <!-- Show the right guide before first paint: ?os=, else the visitor's platform -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('os')
          var n = navigator, ua = n.userAgent || '', d = n.userAgentData || {}
          var p = (d.platform || n.platform || '').toLowerCase()
          var mac = /mac|iphone|ipad|ipod/.test(p) || /mac os x|iphone|ipad/i.test(ua)
          document.documentElement.setAttribute('data-os', q === 'mac' || q === 'windows' ? q : mac ? 'mac' : 'windows')
        } catch (e) {}
      })()
    </script>
    <title>Install Underset — Windows &amp; macOS guide</title>
    <meta
      name="description"
      content="How to open Underset the first time: what the Windows SmartScreen and macOS security warnings mean, and how to get past them in a minute."
    />

  </body>
</html>
